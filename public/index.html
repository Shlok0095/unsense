<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>uncensored.chat</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="/styles.css" />
  </head>
  <body class="overflow-hidden font-mono">
    <div class="hacker-bg" aria-hidden="true">
      <div class="hacker-bg-grid"></div>
      <div class="hacker-bg-scanlines"></div>
      <div class="hacker-bg-glow"></div>
      <div class="hacker-bg-vignette"></div>
    </div>

    <div id="appRoot" class="app-root h-screen">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-header">
          <div class="flex items-center gap-2 text-lg">
            <span class="text-neon">$</span>
            <span class="font-bold text-white">uncensored.chat</span>
          </div>
          <button id="sidebarClose" class="icon-btn" title="Close panel" aria-label="Close panel">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M15 18l-6-6 6-6"/>
            </svg>
          </button>
        </div>

        <div class="sidebar-body">
          <div id="historyList" class="history-list"></div>
        </div>
      </aside>

      <div id="sidebarOverlay" class="sidebar-overlay hidden"></div>

      <div class="chat-shell">
        <header class="topbar">
          <div class="flex min-w-0 flex-1 items-center gap-3">
            <button id="sidebarToggle" class="icon-btn shrink-0" title="Toggle panel" aria-label="Toggle panel">
              <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <rect x="3" y="3" width="18" height="18" rx="2"/>
                <path d="M9 3v18"/>
              </svg>
            </button>
            <span class="shrink-0 text-lg text-neon">$ uncensored</span>
          </div>
          <button id="topNewChatBtn" class="icon-btn topbar-new-btn hidden" title="New session" aria-label="New session">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M12 5v14"/><path d="M5 12h14"/>
            </svg>
          </button>
        </header>

        <main id="chat" class="chat-main">
          <div id="emptyState" class="empty-state">
            <div class="text-6xl text-neon/40 animate-blink">>_</div>
            <h2 class="mt-5 text-3xl text-white">session.ready</h2>
            <p class="mt-3 max-w-lg text-lg text-slate-500">Ask anything.</p>
          </div>
        </main>

        <div class="composer">
          <form id="chatForm" class="composer-box">
            <textarea
              id="prompt"
              rows="1"
              placeholder="Enter command..."
              class="composer-input"
            ></textarea>
            <button id="sendBtn" type="submit" class="btn-send shrink-0">SEND</button>
          </form>
          <p id="errorBox" class="error-box hidden"></p>
        </div>
      </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="/app.js" type="module"></script>
  </body>
</html>
